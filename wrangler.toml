name = "pb"
compatibility_date = "2025-04-24"

# Set to true to use *.workers.dev domain, false if using custom domain
workers_dev = true
main = "worker/index.ts"

[[rules]]
type = "Text"
globs = [ "**/*.html", "**/*.md" ]
fallthrough = true

[assets]
directory = "dist/frontend"
run_worker_first = true
binding = "ASSETS"

[triggers]
# clean r2 garbage every day
crons = ["0 0 * * *"]

#----------------------------------------
# lines below are what you should modify
#----------------------------------------

# Optional: Custom domain configuration
# Uncomment and modify if you want to use a custom domain instead of *.workers.dev
# [[routes]]
# pattern = "your-domain.com"
# custom_domain = true

[[kv_namespaces]]
binding = "PB"  # do not touch this
id = ""  # id of your KV namespace (auto-configured by deploy workflow)

# Optional: R2 bucket for large file storage
# This section will be auto-configured by the deploy workflow
# If R2 is not available, large file uploads will be limited to R2_THRESHOLD
# [[r2_buckets]]
# binding = "R2"  # do not touch this
# bucket_name = "pb-storage"  # bucket name of your R2 bucket (auto-configured)

[vars]
# The URL where your worker is deployed
# If using workers.dev, it will be: https://<worker-name>.<account-subdomain>.workers.dev
# This will be auto-configured by deploy workflow if not set
DEPLOY_URL = ""

# url to repo, displayed in the index page
REPO = "https://github.com/SharzyL/pastebin-worker"

# the page title displayed in index page
INDEX_PAGE_TITLE = "Pastebin Worker"

# the name displayed in TOS
TOS_MAINTAINER = "Sharzy"

# the email displayed in TOS
TOS_MAIL = "pb@shz.al"

# Cache-Control max-age for static pages
CACHE_STATIC_PAGE_AGE = 7200

# Cache-Control max-age for paste pages
CACHE_PASTE_AGE = 600

# Default expiration
DEFAULT_EXPIRATION = "7d"

# Max expiration
MAX_EXPIRATION = "30d"

# A collection of {username: password} pair
# Leave empty to disable auth
BASIC_AUTH = {}

# Files larger than this threshold will be stored in R2
R2_THRESHOLD = "100K"

# File larger than this will be denied
R2_MAX_ALLOWED = "100M"

# The following mimetypes will be converted to text/plain
DISALLOWED_MIME_FOR_PASTE = ["text/html", "audio/x-mpegurl"]
