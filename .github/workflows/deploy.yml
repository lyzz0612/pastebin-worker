name: Test and Deploy
on:
  push:
    branches:
      - goshujin
  workflow_dispatch: # 支持手动触发
    inputs:
      r2_bucket_name:
        description: "R2 存储桶名称 (留空则自动生成)"
        required: false
        default: ""
      deploy_url:
        description: "部署 URL (留空则使用 wrangler.toml 中的配置)"
        required: false
        default: ""
      skip_r2:
        description: "跳过 R2 配置 (仅使用 KV)"
        required: false
        type: boolean
        default: false

env:
  WORKER_NAME: pb
  KV_NAMESPACE_NAME: PB
  # 默认 R2 存储桶名称，可通过 workflow_dispatch 输入覆盖
  R2_BUCKET_NAME: ${{ github.event.inputs.r2_bucket_name || 'pb-storage' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: "Setup"
        run: yarn install

      - name: "Setup Cloudflare Resources"
        id: setup-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
          KV_NAMESPACE_NAME: ${{ env.KV_NAMESPACE_NAME }}
          R2_BUCKET_NAME: ${{ env.R2_BUCKET_NAME }}
          DEPLOY_URL: ${{ github.event.inputs.deploy_url }}
          SKIP_R2: ${{ github.event.inputs.skip_r2 }}
        run: |
          echo "::group::配置 Cloudflare 资源"

          # 如果设置了跳过 R2，清空 R2 存储桶名称
          if [ "$SKIP_R2" = "true" ]; then
            export R2_BUCKET_NAME=""
            echo "已设置跳过 R2 配置"
          fi

          node scripts/setup-cloudflare.js

          echo "::endgroup::"

      - name: "Show Configuration"
        run: |
          echo "::group::当前 wrangler.toml 配置"
          cat wrangler.toml
          echo "::endgroup::"

      - name: "Build Frontend"
        run: yarn build:frontend

      # 可选：部署前运行测试，如果不需要可以注释掉
      # - name: "Test"
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      #   run: |
      #     yarn fmt
      #     yarn lint
      #     yarn test

      - name: "Deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          yarn deploy

      - name: "Deployment Summary"
        if: success()
        run: |
          echo "## 🚀 部署成功!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 配置信息" >> $GITHUB_STEP_SUMMARY
          echo "- **KV ID**: \`${{ steps.setup-cf.outputs.kv_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 启用**: \`${{ steps.setup-cf.outputs.r2_enabled }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.setup-cf.outputs.r2_enabled }}" = "true" ]; then
            echo "- **R2 存储桶**: \`${{ steps.setup-cf.outputs.r2_bucket_name }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 注意事项" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.setup-cf.outputs.r2_enabled }}" != "true" ]; then
            echo "⚠️ R2 未启用，大文件上传将受到限制 (最大 \`R2_THRESHOLD\`)" >> $GITHUB_STEP_SUMMARY
          fi
